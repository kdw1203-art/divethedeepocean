name: Korea dive shops and lodging
on:
  schedule:
    - cron: '41 4 3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/kr_places.py assets/sites.json
      - name: Commit if changed
        run: |
          if git diff --quiet assets/sites.json; then echo "no change"; exit 0; fi
          git config user.name "kr-places-bot"
          git config user.email "kr-places-bot@users.noreply.github.com"
          git add assets/sites.json
          git commit -m "국내 다이빙 업체·숙소 갱신 (OpenStreetMap)"
          git push
