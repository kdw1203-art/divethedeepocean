name: Monthly OSM dive centre refresh
on:
  schedule:
    - cron: '17 3 2 * *'   # 2nd of each month, 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/osm_refresh.py assets/sites.json
      - name: Commit if changed
        run: |
          if git diff --quiet assets/sites.json; then echo "no change"; exit 0; fi
          git config user.name "osm-refresh-bot"
          git config user.email "osm-refresh-bot@users.noreply.github.com"
          git add assets/sites.json
          git commit -m "Monthly OSM refresh of dive centres"
          git pull --rebase
          git push
