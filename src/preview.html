<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dive the deep ocean</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F2E">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="포인트, 리조트, 강사와 자격증, 가는 길과 비용, 다이브 로그와 장비 정비까지. 스쿠버·프리다이버를 위한 바다 안내서.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 120 120%27%3E%3Ccircle cx=%2760%27 cy=%2760%27 r=%2760%27 fill=%27%230B1F2E%27/%3E%3Cpath d=%27M30 84a30 30 0 0 1 60 0%27 fill=%27none%27 stroke=%27%235CC8F0%27 stroke-width=%2710%27/%3E%3Ccircle cx=%2760%27 cy=%2784%27 r=%279%27 fill=%27%23F6A04D%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  /* 앱형 웹: 왼쪽 메뉴 + 작업 화면. 휴대폰에서는 하단 탭. 바다 블루 하나와 포인트 오렌지 하나. */
  --bg:#F1F5F8; --panel:#FFFFFF; --ink:#0B1F2E; --sub:#4A5B68; --line:#DCE4EA; --soft:#E3F0F7;
  --sea:#0A5C8A; --sea-ink:#FFFFFF; --coral:#F6A04D; --coral-ink:#6B3006; --coral-soft:#FDEBD9;
  --ok:#0B6B3A; --ok-soft:#DDF3E6; --deep:#0B1F2E; --deep-2:#15324A; --map:#0D3550; --land:#2A6283;
  --font-brand:'Sora','IBM Plex Sans KR',system-ui,sans-serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081722; --panel:#0E2232; --ink:#E7F0F5; --sub:#A3B6C3; --line:#1F3A4F; --soft:#123348;
  --sea:#5CC8F0; --sea-ink:#06202F; --coral:#F6A04D; --coral-ink:#FFD3A8; --coral-soft:#3A2614;
  --ok:#7FD6A3; --ok-soft:#12352A; --deep:#04121C; --deep-2:#0F2A3D; --map:#06263A; --land:#1E4E6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081722; --panel:#0E2232; --ink:#E7F0F5; --sub:#A3B6C3; --line:#1F3A4F; --soft:#123348;
  --sea:#5CC8F0; --sea-ink:#06202F; --coral:#F6A04D; --coral-ink:#FFD3A8; --coral-soft:#3A2614;
  --ok:#7FD6A3; --ok-soft:#12352A; --deep:#04121C; --deep-2:#0F2A3D; --map:#06263A; --land:#1E4E6B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--sea)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:6px}
.topact{display:flex;align-items:center;gap:8px}
@media (max-width:520px){#authAct .btn{height:40px;padding:0 11px;font-size:13px}.topbar{gap:10px;padding:0 12px}}
@media (max-width:380px){#themeBtn{width:36px;height:36px}#authAct{gap:6px}#authAct .btn{padding:0 8px}.brand svg{width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr);height:100%}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);width:192px;flex:none}
.wm{display:flex;flex-direction:column;gap:3px;line-height:1}
.wm small{font-family:var(--font-brand);font-size:9px;font-weight:500;letter-spacing:2.4px;color:#2C8FC4}
.wm b{font-family:var(--font-brand);font-size:19px;letter-spacing:-.4px}
.gsearch{flex:1;max-width:560px;position:relative}
.gsearch input{width:100%;height:42px;padding:0 14px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:15px var(--font-body)}
.gsearch input:focus{outline:none;border-color:var(--sea)}
.gsearch svg{position:absolute;left:13px;top:12px}
.gres{position:absolute;left:0;right:0;top:48px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -20px rgba(0,0,0,.35);padding:6px;display:none;z-index:30}
.gres.open{display:block}
.gres a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px}
.gres a:hover,.gres a:focus{background:var(--soft)}
.gres a span{color:var(--sub);font-size:12px}
.topact{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;border:0;font:700 14px var(--font-body);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-pri{background:var(--sea);color:var(--sea-ink)}
.btn-line{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.btn-coral{background:var(--coral);color:#0B1F2E}

.side{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:1px;padding:14px 12px 6px}
.side a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.side a:hover{background:var(--bg)}
.side a[aria-current="page"]{background:var(--soft);color:var(--sea);font-weight:700}
.side svg{flex:none}
.main{overflow-y:auto;padding:28px 32px 60px}
.view{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vh h1{font-size:26px;letter-spacing:-.4px}
.vh p{margin:4px 0 0;color:var(--sub)}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:60px minmax(0,1fr) 64px}
  .side{display:none}
  .brand{width:auto}
  .brand .wm b{font-size:17px}
  .gsearch{display:none}
  .main{padding:18px 16px 30px}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border-top:1px solid var(--line)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--sub);font-size:11px;font-weight:500}
  .tabbar a[aria-current="page"]{color:var(--sea);font-weight:700}
}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h2{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.panel h2 a{font-size:13px;font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--sea-ink);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--sea);white-space:nowrap}
.tag.fr{background:var(--coral-soft);color:var(--coral-ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.gray{background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.item:last-child{border-bottom:0}
a.item:hover{background:var(--bg)}
.thumb{flex:none;width:56px;height:56px;border-radius:12px;background:#24688A}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--line)}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .tx b{font-size:15px}
.item .tx span{font-size:13px;color:var(--sub)}
.item .rt{flex:none;font-weight:700;color:var(--sea);font-size:14px}
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px;font-weight:500;text-align:center}
.cat:hover{border-color:var(--sea)}
.cat i{width:42px;height:42px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--sea)}
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:var(--map)}
.mapwrap svg{display:block;width:100%;height:auto}
.maplegend{position:absolute;left:12px;bottom:12px;display:flex;gap:12px;padding:6px 10px;border-radius:8px;background:rgba(6,24,38,.85);color:#fff;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.spot{cursor:pointer}
.cond{background:var(--deep);color:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.cond .row{display:flex;justify-content:space-between;align-items:baseline}
.cond .row span{font-size:12px;color:#B9CBD8}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mgrid div{background:var(--deep-2);border-radius:10px;padding:10px}
.mgrid small{display:block;font-size:11px;color:#B9CBD8}
.mgrid b{display:block;font-family:var(--font-brand);font-size:18px;font-variant-numeric:tabular-nums}
.mgrid em{font-style:normal;font-size:10px}
.m{color:#8FD3F2}.c{color:#F6C38F}.d{color:#C9B8F5}
.sleep{display:flex;height:9px;gap:2px;border-radius:5px;overflow:hidden}
.small{font-size:12px;color:var(--sub)}
.cond .small{color:#B9CBD8}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat small{display:block;font-size:12px;color:var(--sub)}
.stat b{font-family:var(--font-brand);font-size:18px;font-variant-numeric:tabular-nums}
.hero{height:220px;border-radius:16px;background:#1D5B7A;display:flex;align-items:flex-end;padding:16px}
.hero span{font-size:12px;color:#fff;background:rgba(6,24,38,.7);padding:4px 8px;border-radius:6px}
.tl{display:flex;flex-direction:column}
.tl div{display:flex;gap:14px;padding-bottom:16px;position:relative}
.tl div::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;background:var(--sea);margin-top:5px}
.tl div::after{content:"";position:absolute;left:5px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl div:last-child::after{display:none}
.tl b{display:block}
.tl span{font-size:13px;color:var(--sub)}
.bar{height:7px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:7px;border-radius:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.mk{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.mk div{height:110px;background:var(--line)}
.mk p{margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.mk b{font-size:14px}
.ladder{display:flex;flex-direction:column;gap:8px}
.ladder div{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg)}
.ladder i{font-style:normal;font-family:var(--font-mono);font-size:12px;color:var(--sea);min-width:48px}
.ladder.free i{color:var(--coral-ink)}
.ladder span{flex:1;font-weight:500}
.ladder small{color:var(--sub)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.form input,.form select{height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:15px var(--font-body)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.plan{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.plan.pick{border:2px solid var(--sea)}
.plan .p{font-family:var(--font-brand);font-size:24px;font-weight:700}
.plan .f{color:var(--sea);font-weight:700}
.plan ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--sub)}
.big{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;background:var(--deep);color:#fff;border-radius:16px;padding:22px}
.big b{font-family:var(--font-brand);font-size:64px;line-height:1;color:var(--coral)}
.big span{max-width:46ch;color:#C7D6E1}
.notice{padding:12px 14px;border-radius:12px;background:var(--coral-soft);color:var(--coral-ink);font-size:13px}
.tbl{overflow-x:auto}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--sub);white-space:nowrap}
tr:last-child td{border-bottom:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:22px;border:1.5px dashed var(--sub);border-radius:14px;cursor:pointer;text-align:center}
.drop:hover{border-color:var(--sea);color:var(--sea)}
.scan{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.scan img{width:160px;height:200px;object-fit:cover;border-radius:12px;background:var(--bg)}
.feed{display:flex;flex-direction:column;gap:20px;max-width:560px;margin:0 auto;width:100%}
.post{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.post header{display:flex;align-items:center;gap:10px;padding:12px 14px}
.post .ph{display:flex;align-items:flex-end;width:100%;aspect-ratio:1/1;object-fit:cover}
.post div.ph{padding:14px}.post div.ph span{font-size:12px;color:#fff;background:rgba(6,24,38,.6);padding:3px 8px;border-radius:6px}
.post .pb{padding:12px 14px;display:flex;flex-direction:column;gap:8px}.post .pb p{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.fgrid>*{aspect-ratio:1/1;width:100%;object-fit:cover;display:flex;align-items:flex-end;padding:8px}
.fgrid img{padding:0}.fgrid span{font-size:11px;color:#fff}
.zoomer{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoomer button{width:42px;height:42px;border:0;border-radius:10px;background:#fff;color:#0B1F2E;font-size:20px;cursor:pointer}
.osmtg{position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(6,24,38,.85);color:#fff;font-size:12px}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sp{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);min-width:0}
.sp img,.sp .noimg{flex:none;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--soft)}
.sp .tx{display:flex;flex-direction:column;min-width:0}.sp b,.sp i{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sp i{font-size:12px;color:var(--sub)}
.chip:disabled{opacity:.4;cursor:default}
.en{font-size:12px;color:var(--sub);font-family:var(--font-brand)}
.steps{list-style:none;display:flex;gap:8px;margin:0;padding:0;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--sub)}
.steps b{width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px}
.steps li[aria-current]{color:var(--ink);border-color:var(--sea);font-weight:700}.steps li[aria-current] b,.steps li.dn b{background:var(--sea);color:var(--sea-ink)}
.form textarea{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:15px var(--font-body);resize:vertical}
.form input[type=file]{padding:10px;height:auto}
.form fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}.form legend{font-size:13px;font-weight:700;padding:0;margin-bottom:6px}
.form .ck{flex-direction:row;align-items:center;gap:10px;font-weight:500;font-size:14px;flex-wrap:wrap}.form .ck input{width:22px;height:22px;flex:none;padding:0}
.err{color:#B42318;font-size:12px;font-weight:700}
:root[data-theme="dark"] .err{color:#FF9B8F}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#0B1F2E;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;border:1px solid rgba(255,255,255,.2)}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{color:var(--sub);font-size:14px;padding:10px 0}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#home" aria-label="Dive the deep ocean 홈">
      <svg width="36" height="36" viewBox="0 0 120 120" aria-hidden="true"><path d="M38 98 A22 22 0 0 1 82 98" fill="none" stroke="#5CC8F0" stroke-width="8" stroke-linecap="round"/><path d="M20 98 A40 40 0 0 1 100 98" fill="none" stroke="#2C8FC4" stroke-width="8" stroke-linecap="round"/><path d="M4 98 A56 56 0 0 1 116 98" fill="none" stroke="#1C5C84" stroke-width="8" stroke-linecap="round"/><circle cx="60" cy="98" r="9" fill="#F6A04D"/></svg>
      <span class="wm"><small>DIVE THE</small><b>deep ocean</b></span>
    </a>
    <div class="gsearch">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color:var(--sub)"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z"/><path d="M21 21l-5-5"/></svg>
      <label for="gq" style="position:absolute;left:-9999px">통합 검색</label>
      <input id="gq" placeholder="포인트 · 리조트 · 강사 · 장비 검색" autocomplete="off">
      <div class="gres" id="gres" role="listbox"></div>
    </div>
    <div class="topact">
      <button class="iconbtn" id="themeBtn" type="button" aria-label="화면 밝기 바꾸기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
      <span id="authAct" style="display:flex;gap:8px"></span>
    </div>
  </header>

  <nav class="side" aria-label="주 메뉴" id="side"></nav>
  <main class="main" id="main"></main>
  <nav class="tabbar" aria-label="하단 메뉴" id="tabbar"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

function upload(bucket,blob,name){var path=BE.user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'-'+String(name||'file').replace(/[^\w.\-]/g,'_').slice(-40);return BE.sb.storage.from(bucket).upload(path,blob,{upsert:false,contentType:blob.type||undefined}).then(function(r){if(r.error)throw r.error;return path;});}
BE.pull=function(){if(!BE.on)return Promise.resolve();var sb=BE.sb,u=BE.user,jobs=[];
  jobs.push(sb.from('posts').select('id,author_nick,spot,body,photo,log_label,created_at,post_likes(count)').order('created_at',{ascending:false}).limit(60).then(function(r){if(r.data)state.pubPosts=r.data.map(function(p){var s=spot(p.spot)||{};return {id:'p'+p.id,dbid:p.id,user:p.author_nick||'다이버',sid:p.spot,spot:s.name||p.spot,url:pubUrl(p.photo),log:p.log_label,text:p.body||' ',likes:(p.post_likes&&p.post_likes[0]?p.post_likes[0].count:0),cm:0};});}));
  jobs.push(sb.from('market_items').select('*').eq('status','active').order('created_at',{ascending:false}).limit(60).then(function(r){if(r.data)state.pubItems=r.data;}));
  jobs.push(sb.from('meetups').select('*').gte('meet_date',new Date().toISOString().slice(0,10)).order('meet_date').limit(60).then(function(r){if(r.data)state.pubMeets=r.data;}));
  jobs.push(sb.from('businesses').select('id,biz_type,name,name_en,spot,services,langs,price,status').eq('status','approved').limit(200).then(function(r){if(r.data)state.pubBiz=r.data;}));
  if(u){
    jobs.push(sb.from('profiles').select('*').eq('id',u.id).maybeSingle().then(function(r){if(r.data){var p=r.data;state.me={nick:p.nick,email:u.email,kind:p.dive_kind,cert:p.cert,org:p.orgs,logs:p.log_count,interest:p.interests,admin:p.is_admin};}}));
    jobs.push(sb.from('gear').select('*').order('created_at').then(function(r){if(r.data)state.gearL=r.data.map(function(g){return {id:g.id,cat:g.cat,brand:g.brand,model:g.model,bought:g.bought,served:g.served,dives:g.dives};});}));
    jobs.push(sb.from('dive_logs').select('*').order('dive_date',{ascending:false}).limit(200).then(function(r){if(r.data)state.userLogs=r.data.map(function(l){return {id:l.id,url:pubUrl(l.photo),date:l.dive_date,site:l.site,depth:l.max_depth,time:l.minutes};});}));
    jobs.push(sb.from('businesses').select('*').eq('owner',u.id).order('created_at').then(function(r){if(r.data)state.biz=r.data.map(function(b){return {dbid:b.id,type:b.biz_type,name:b.name,nameEn:b.name_en,spot:b.spot,addr:b.addr,tel:b.tel,web:b.web,lang:b.langs,svc:b.services,org:b.orgs,fac:b.facilities,price:b.price,intro:b.intro,status:({pending:'심사 중',approved:'승인됨',rejected:'반려됨'})[b.status],at:b.created_at.slice(0,10),d_biz:(b.docs||{}).d_biz?'제출됨':'',d_ins:(b.docs||{}).d_ins?'제출됨':'',d_cert:(b.docs||{}).d_cert?'제출됨':''};});}));
    jobs.push(sb.from('market_items').select('*').eq('owner',u.id).then(function(r){if(r.data)state.items=r.data.map(mapItem);}));
    jobs.push(sb.from('meetups').select('*').eq('owner',u.id).then(function(r){if(r.data)state.meets=r.data.map(mapMeet);}));
    jobs.push(sb.from('post_likes').select('post_id').eq('user_id',u.id).then(function(r){if(r.data){state.likes={};r.data.forEach(function(x){state.likes['p'+x.post_id]=true;});}}));
  }
  return Promise.all(jobs).then(function(){BE.ready=true;rerender();},function(){BE.ready=true;rerender();});};
function mapItem(b){return {dbid:b.id,title:b.title,cat:b.cat,brand:b.brand,price:b.price,cond:b.cond,served:b.served,receipt:b.receipt?'첨부됨':'',escrow:b.escrow,desc:b.descr,photo:b.photo?'사진 있음':'',url:pubUrl(b.photo),at:(b.created_at||'').slice(0,10)};}
function mapMeet(b){return {dbid:b.id,title:b.title,kind:b.kind,spot:b.spot,date:b.meet_date,max:b.max_people,cert:b.min_cert,logs:b.min_logs,desc:b.descr};}

BE.submit=function(id,v){var sb=BE.sb,u=BE.user,f=FILES[id]||{};
  if(id==='signup'){var meta={nick:v.nick,kind:v.kind,cert:v.cert,org:v.org||[],logs:v.logs||'',interest:v.interest||[],health:!!v.health,mkt:!!v.mkt};
    return sb.auth.signUp({email:v.email,password:BE._pw,options:{data:meta,emailRedirectTo:location.origin+location.pathname}}).then(function(r){BE._pw=null;if(r.error)throw r.error;if(!r.data.session){toast('확인 메일을 보냈어요. 메일의 링크를 누르면 가입이 끝나요.');return 'login';}return 'profile';});}
  if(id==='login')return sb.auth.signInWithPassword({email:v.email,password:BE._pw}).then(function(r){BE._pw=null;if(r.error)throw r.error;return 'profile';});
  if(!u)return needLogin();
  function up(bucket,key){return f[key]?upload(bucket,f[key],f[key].name):Promise.resolve(null);}
  if(id==='biz')return Promise.all([up('docs','d_biz'),up('docs','d_ins'),up('docs','d_cert')]).then(function(p){return sb.from('businesses').insert({biz_type:v.type,name:v.name,name_en:v.nameEn,spot:v.spot,addr:v.addr,owner_name:v.owner,email:v.email,tel:v.tel,web:v.web,langs:v.lang||[],services:v.svc||[],orgs:v.org||[],facilities:v.fac||[],price:v.price,intro:v.intro,docs:{d_biz:p[0],d_ins:p[1],d_cert:p[2]}});}).then(function(r){if(r.error)throw r.error;return BE.pull().then(function(){return 'bizpage-'+(state.biz.length-1);});});
  if(id==='gearreg')return up('docs','receipt').then(function(p){return sb.from('gear').insert({cat:v.cat,brand:v.brand,model:v.model,serial:v.serial,bought:v.bought||null,served:v.served||null,dives:+v.dives||0,alarm:!!v.alarm,link_logs:!!v.link,receipt:p});}).then(function(r){if(r.error)throw r.error;return BE.pull().then(function(){return 'gear';});});
  if(id==='sell')return Promise.all([up('media','photo'),up('media','receipt')]).then(function(p){return sb.from('market_items').insert({title:v.title,cat:v.cat,brand:v.brand,price:+v.price,cond:v.cond,served:v.served||null,photo:p[0],receipt:p[1],descr:v.desc,escrow:!!v.escrow});}).then(function(r){if(r.error)throw r.error;return BE.pull().then(function(){return 'item-'+(state.items.length-1);});});
  if(id==='meet')return sb.from('meetups').insert({title:v.title,kind:v.kind,spot:v.spot,meet_date:v.date,max_people:+v.max,min_cert:v.cert,min_logs:+v.logs||0,descr:v.desc}).then(function(r){if(r.error)throw r.error;return BE.pull().then(function(){return 'meet-'+(state.meets.length-1);});});
  return Promise.reject('unknown');};

function route(){
  var h=(location.hash||'#home').slice(1), id=h, arg=null;
  var dash=h.indexOf('-');if(!V[h]&&dash>0&&V[h.slice(0,dash)]){id=h.slice(0,dash);arg=h.slice(dash+1);}
  if(!V[id]){id='home';}
  need(id);
  main.innerHTML='<div class="view">'+V[id](arg)+'</div>';
  main.scrollTop=0;
  var cur=({admin:'profile',login:'profile',spot:'map',compare:'map',signup:'profile',biz:'partner',bizpage:'partner',gearreg:'gear',sell:'gear',item:'gear',meet:'community'})[id]||id;
  document.querySelectorAll('[data-nav]').forEach(function(a){if(a.dataset.nav===cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  bind();paintAuth();
}
function rerender(){var y=main.scrollTop;route();main.scrollTop=y;}
function bind(){

  main.querySelectorAll('[data-pick]').forEach(function(g){
    var go=function(){state.sel=g.dataset.pick;rerender();};
    g.addEventListener('click',go);
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
  function fixSel(){var s0=spot(state.sel);if(!vis(s0)){var f=SPOTS.filter(vis)[0];if(f)state.sel=f.id;}}
  main.querySelectorAll('[data-region]').forEach(function(b){b.addEventListener('click',function(){state.region=b.dataset.region;fixSel();rerender();});});
  main.querySelectorAll('[data-lcat]').forEach(function(b){b.addEventListener('click',function(){state.lcat=b.dataset.lcat;rerender();});});

V.terms=function(){setTitle('이용약관');return '<div class="vh"><div><h1>이용약관</h1><p>시행일 2026년 11월 12일</p></div></div><div class="panel doc">'+

'<h2>3. 다이버 이용 요금</h2><p>다이버가 쓰는 기능은 무료예요. 중고 장비 안전거래를 고르면 구매자 수수료 3%가 붙고, 이 경우 결제 화면에서 금액을 먼저 보여드려요.</p>'+
'<h2>4. 정보의 성격</h2><p>포인트 수심·수온·시즌, 계산기 결과, 정비 주기는 참고용 일반 정보예요. 실제 다이빙은 다이브 컴퓨터, 교육받은 절차, 현지 가이드 브리핑을 따라야 하고, 서비스는 이 정보만으로 생긴 사고에 책임지지 않아요.</p>'+
'<h2>5. 게시물</h2><p>올린 사진과 글의 권리는 올린 사람에게 있어요. 서비스는 화면에 보여주고 공유 미리보기를 만드는 범위에서만 써요. 다른 사람의 권리를 침해하거나 광고·욕설·불법 거래에 해당하는 게시물은 알리지 않고 내릴 수 있어요.</p>'+
'<h2>6. 중고 거래</h2><p>판매자와 구매자가 직접 거래해요. 고압 탱크 택배 발송, 정비 이력 허위 기재, 보호종으로 만든 물건 판매는 금지예요. 안전거래를 쓰지 않은 직거래 분쟁은 당사자 사이에서 해결해야 해요.</p>'+
'<h2>7. 업체</h2><p>입점 업체는 심사를 통과해야 노출돼요. 예약 수수료와 요금제는 입점·광고 화면에 적힌 대로 적용하고, 바뀌면 30일 전에 알려드려요.</p>'+

V.privacy=function(){setTitle('개인정보 처리방침');return '<div class="vh"><div><h1>개인정보 처리방침</h1><p>시행일 2026년 11월 12일</p></div></div><div class="panel doc">'+

function parseDiveXml(txt,name){var doc=new DOMParser().parseFromString(txt,'application/xml'),out=[];if(doc.querySelector('parsererror'))return out;
  var dives=doc.getElementsByTagName('dive');[].forEach.call(dives,function(d){var o={src:'파일'};
    var dt=d.getAttribute('date')||(d.getElementsByTagName('datetime')[0]||{}).textContent||'';o.date=String(dt).slice(0,10);
    var dur=d.getAttribute('duration');if(dur){var m=dur.match(/(\d+):(\d+)/);if(m)o.time=+m[1]+Math.round(+m[2]/60);}
    var dc=d.getElementsByTagName('divecomputer')[0],depthEl=dc&&dc.getElementsByTagName('depth')[0];if(depthEl&&depthEl.getAttribute('max'))o.depth=parseFloat(depthEl.getAttribute('max'));
    var gm=d.getElementsByTagName('greatestdepth')[0];if(gm)o.depth=parseFloat(gm.textContent);var dt2=d.getElementsByTagName('diveduration')[0];if(dt2)o.time=Math.round(parseFloat(dt2.textContent)/60);
    if(!o.depth){var mx=0;[].forEach.call(d.getElementsByTagName('depth'),function(e){var v=parseFloat(e.textContent);if(v>mx)mx=v;});if(mx)o.depth=mx;}
    var site=d.getAttribute('divesiteid');if(site){var ds=doc.querySelector('site[uuid="'+site+'"]');if(ds)o.site=ds.getAttribute('name');}
    var lk=d.getElementsByTagName('link')[0];if(lk&&!o.site){var sid=lk.getAttribute('ref'),se=sid&&doc.querySelector('site[id="'+sid+'"]'),nm=se&&se.getElementsByTagName('name')[0];if(nm)o.site=nm.textContent;}
    if(o.depth)o.depth=Math.round(o.depth*10)/10;if(o.date||o.depth)out.push(o);});return out;}
